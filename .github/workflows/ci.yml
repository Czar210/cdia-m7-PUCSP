name: CI Bella Tavola

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: qualidade
  # Roda em todo push e PR. Feedback rapido.
  # Não depende de secrets nem de recursos externos.
  # ─────────────────────────────────────────────────────
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r api/requirements.txt

      - name: Diagnóstico do ambiente
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Arquivos do projeto ==="
          test -f api/main.py        && echo "✅ main.py"          || echo "❌ main.py ausente"
          test -f api/config.py       && echo "✅ config.py"        || echo "❌ config.py ausente"
          test -f api/pytest.ini      && echo "✅ pytest.ini"       || echo "❌ pytest.ini ausente"
          test -d api/tests           && echo "✅ tests/"           || echo "❌ tests/ ausente"

      - name: Rodar testes smoke
        working-directory: api
        run: pytest tests/ -v -m smoke --tb=short

  # ─────────────────────────────────────────────────────
  # JOB 2: integracao
  # Roda apenas em push para main (após qualidade).
  # Usa HF_TOKEN para baixar o modelo e rodar testes completos.
  # ─────────────────────────────────────────────────────
  integracao:
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.event_name == 'push'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r api/requirements.txt

      - name: Cache do modelo Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-${{ hashFiles('api/requirements.txt') }}

      - name: Verificar autenticação com Hugging Face
        run: python -c "import os; assert os.environ.get('HF_TOKEN'), 'HF_TOKEN não configurado'"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Rodar testes completos
        working-directory: api
        run: pytest tests/ -v --tb=short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_PATH: ../datagen/models/credit_rf.pkl

  # ─────────────────────────────────────────────────────
  # JOB 3: docker
  # Roda apenas em push (após integracao). Se os testes
  # falharam, a imagem não é publicada. Usa o SHA do commit
  # como tag para rastreabilidade (código → commit → imagem).
  # ─────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: integracao
    if: github.event_name == 'push'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # context: ./api → a imagem é construída a partir do Dockerfile em api/.
      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bella-tavola:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/bella-tavola:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────
  # JOB 4: relatorio
  # Resumo final. Roda apos docker.
  # ─────────────────────────────────────────────────────
  relatorio:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Resumo do pipeline
        run: |
          echo "========================================="
          echo "  CI Bella Tavola: Pipeline Completo"
          echo "========================================="
          echo ""
          echo "✅ Job qualidade:   passou"
          echo "✅ Job integracao:  passou"
          echo "✅ Job docker:      passou"
          echo "✅ Job relatorio:   executando"
          echo ""
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Autor:   ${{ github.actor }}"
          echo "Imagem:  ${{ secrets.DOCKER_USERNAME }}/bella-tavola:${{ github.sha }}"
          echo ""
          echo "Pipeline concluído com sucesso."
