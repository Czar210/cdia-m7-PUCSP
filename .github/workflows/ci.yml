name: CI — Bella Tavola

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: qualidade
  # Roda em todo push e PR — feedback rápido.
  # Não depende de secrets nem de recursos externos.
  # ─────────────────────────────────────────────────────
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r Fast-API/requirements.txt

      - name: Diagnóstico do ambiente
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Arquivos do projeto ==="
          test -f Fast-API/main.py        && echo "✅ main.py"          || echo "❌ main.py ausente"
          test -f Fast-API/config.py       && echo "✅ config.py"        || echo "❌ config.py ausente"
          test -f Fast-API/pytest.ini      && echo "✅ pytest.ini"       || echo "❌ pytest.ini ausente"
          test -d Fast-API/tests           && echo "✅ tests/"           || echo "❌ tests/ ausente"

      - name: Rodar testes smoke
        working-directory: Fast-API
        run: pytest tests/ -v -m smoke --tb=short

  # ─────────────────────────────────────────────────────
  # JOB 2: integracao
  # Roda apenas em push para main (após qualidade).
  # Usa HF_TOKEN para baixar o modelo e rodar testes completos.
  # ─────────────────────────────────────────────────────
  integracao:
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.event_name == 'push'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r Fast-API/requirements.txt

      - name: Cache do modelo Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-${{ hashFiles('Fast-API/requirements.txt') }}

      - name: Verificar autenticação com Hugging Face
        run: python -c "import os; assert os.environ.get('HF_TOKEN'), 'HF_TOKEN não configurado'"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Rodar testes completos
        working-directory: Fast-API
        run: pytest tests/ -v --tb=short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_PATH: ../Hug/data/models/credit_rf.pkl

  # ─────────────────────────────────────────────────────
  # JOB 3: relatorio
  # Resumo final — roda após integração.
  # ─────────────────────────────────────────────────────
  relatorio:
    runs-on: ubuntu-latest
    needs: integracao
    if: github.event_name == 'push'

    steps:
      - name: Resumo do pipeline
        run: |
          echo "========================================="
          echo "  CI — Bella Tavola — Pipeline Completo"
          echo "========================================="
          echo ""
          echo "✅ Job qualidade:   passou"
          echo "✅ Job integracao:  passou"
          echo "✅ Job relatorio:   executando"
          echo ""
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Autor:   ${{ github.actor }}"
          echo ""
          echo "Pipeline concluído com sucesso."
