# =============================================================
# CI Completo -- Bella Tavola (Pipeline Definitivo)
# =============================================================
# Workflow final com 3 jobs: qualidade, integracao e relatorio.
# Corresponde ao exercicio 6.5 da Parte 3 (desafio final).
#
# Fluxo:
#   push/PR --> [qualidade] --> [integracao] --> [relatorio]
#
#   qualidade:   roda em todo push e PR
#   integracao:  roda apenas em push para main (precisa de secret)
#   relatorio:   roda sempre (mesmo se jobs anteriores falharem)
# =============================================================

name: CI -- Bella Tavola

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------
  # JOB 1: Qualidade do codigo e testes smoke
  # -----------------------------------------------------------
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Verificacao de formatacao (requer black no requirements.txt)
      - name: Verificar formatacao com black
        run: black --check .

      # Verificacao de imports nao utilizados (requer autoflake)
      - name: Verificar imports com autoflake
        run: autoflake --check --remove-all-unused-imports -r .

      # Testes rapidos (apenas smoke)
      - name: Rodar testes smoke
        run: pytest tests/ -v --tb=short -m smoke

  # -----------------------------------------------------------
  # JOB 2: Testes de integracao com modelo do HF Hub
  # -----------------------------------------------------------
  testes-integracao:
    runs-on: ubuntu-latest
    needs: qualidade
    # So roda em push para main (nao em PRs)
    # Motivo: PRs de forks nao tem acesso aos secrets
    if: github.event_name == 'push'

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cache do modelo para evitar download repetido
      - name: Cache do modelo Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-v1-${{ hashFiles('requirements.txt') }}

      # Diagnostico do ambiente (ajuda no debugging)
      - name: Diagnostico do ambiente
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Dependencias instaladas ==="
          pip list
          echo "=== Estrutura do projeto ==="
          find . -type f -name "*.py" | head -20

      # Verifica que o token esta disponivel (sem expor)
      - name: Verificar autenticacao com Hugging Face
        run: python -c "import os; assert os.environ.get('HF_TOKEN'), 'HF_TOKEN nao encontrado'"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Roda testes de integracao (modelo + endpoint /ml/predict)
      - name: Rodar testes de integracao
        run: pytest tests/ -v --tb=short -m integracao
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  # -----------------------------------------------------------
  # JOB 3: Relatorio (roda sempre, mesmo se algo falhou)
  # -----------------------------------------------------------
  relatorio:
    runs-on: ubuntu-latest
    needs: [qualidade, testes-integracao]
    if: always()

    steps:
      - name: Resumo do pipeline
        run: |
          echo "========================================"
          echo "  Resumo do Pipeline CI - Bella Tavola"
          echo "========================================"
          echo ""
          echo "Job qualidade:    ${{ needs.qualidade.result }}"
          echo "Job integracao:   ${{ needs.testes-integracao.result }}"
          echo ""
          if [ "${{ needs.qualidade.result }}" == "success" ] && \
             [ "${{ needs.testes-integracao.result }}" == "success" ]; then
            echo "Pipeline VERDE -- tudo passou!"
          else
            echo "Pipeline com falhas -- verifique os logs acima."
          fi
