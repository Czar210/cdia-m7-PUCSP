# nginx.conf — proxy reverso para a API Bella Tavola.
# Montado em /etc/nginx/conf.d/default.conf pelo docker-compose.yml.
#
# Fluxo:  Usuário → porta 80 (Nginx) → http://api:8000 (uvicorn)
# 'api' é resolvido pelo DNS interno da rede do Docker Compose (nome do serviço).

server {
    listen 80;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /ml/predict pode baixar o modelo do Hub na primeira chamada — dá folga no timeout.
        proxy_read_timeout 120s;
    }
}
